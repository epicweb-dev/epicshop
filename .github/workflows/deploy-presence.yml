name: Deploy Presence App
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  deploy:
    name: 🚀 Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.repository == 'epicweb-dev/epicshop' }}
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v5

      - name: ⎔ Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: 'npm'

      - name: 📥 Download deps
        run: npm install --prefer-offline --no-audit --no-fund

      - name: 🏗 Build workshop-presence
        run: npx nx run @epic-web/workshop-presence:build

      - name: 🔍 Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token with the Edit Cloudflare Workers permission template and add it as repository secret CLOUDFLARE_API_TOKEN."
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID. Add your Cloudflare account ID as repository secret CLOUDFLARE_ACCOUNT_ID."
            missing=1
          fi
          exit $missing

      - name: 🚀 Deploy with Wrangler
        run: npm run deploy --workspace=@epic-web/workshop-presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
